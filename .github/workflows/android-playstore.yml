name: Android Google Play Deployment

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (production or preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Automatically submit AAB to Google Play Console (Internal Track)'
        required: true
        type: boolean
        default: true
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/**'

concurrency:
  group: android-playstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate Code & Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Jest Test Suite
        run: npm test

  build-and-submit-eas:
    name: EAS Build & Submit to Google Play
    needs: validate-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB and Submit to Google Play
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == true }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive \
            --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK / AAB only (No auto-submit)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_submit == false }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

