<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Offline – ReNu-Biome Grower Portal</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/renu-biome-app-icon-180.png" />
  <meta name="theme-color" content="#3A7A57" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      max-width: 460px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #E2E8F0;
    }
    .icon-container {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #F0FDF4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      border: 2px solid #BBF7D0;
    }
    .icon-container img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #3A7A57;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease-in-out;
    }
    .btn:hover {
      background: #2E6245;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEF2F2;
      color: #DC2626;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DC2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <img src="/brand/renu-biome-app-icon-180.png" alt="ReNu-Biome" />
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      Offline Mode
    </div>
    <h1>Connection Unavailable</h1>
    <p>
      The ReNu-Biome Grower Portal needs an active connection to display live ranch telemetry, delivery schedules, and agronomy data.
      Please check your mobile data or Wi-Fi.
    </p>
    <button class="btn" onclick="retryConnection()">Try Again</button>
  </div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn');
        btn.textContent = 'Still Offline... Checking';
        setTimeout(() => {
          btn.textContent = 'Try Again';
        }, 2000);
      }
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
